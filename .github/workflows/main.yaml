name: Build Executable

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.x

    - name: Install pyinstaller
      run: pip install pyinstaller

    - name: Set OS-specific name
      id: os-name
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          echo "os_name=linux" >> $GITHUB_ENV
        elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          echo "os_name=windows" >> $GITHUB_ENV
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          echo "os_name=macos" >> $GITHUB_ENV
        fi

    - name: Build executable
      run: pyinstaller --onefile --name lentbuddy-${{ env.os_name }} bootstrap.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: lentbuddy-${{ env.os_name }}
        path: dist/lentbuddy-${{ env.os_name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Upload to latest release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get the latest release upload URL
        latest_release=$(gh api repos/${{ github.repository }}/releases/latest --jq .upload_url)
        upload_url=${latest_release/"{?name,label}"/""}

        # Upload each artifact to the latest release
        for file in artifacts/*; do
          name=$(basename "$file")
          gh api "$upload_url?name=$name" \
            -H "Content-Type: application/octet-stream" \
            --input "$file"
        done